<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Adarsh R M. Get in touch for web development opportunities, projects, or collaborations.">
    <title>Contact | Adarsh R M</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header>
        <div class="container header-container">
            <div class="logo">Adarsh R M</div>
            <nav aria-label="Main Navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="container">
        <h1>Contact Me</h1>
        <p>If you'd like to work together, please fill out the form below.</p>
        
        <section class="contact-form-section">
            <form id="contact-form" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="name">Full Name <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="name" required autocomplete="name" aria-describedby="name-error">
                    <span class="error-message" id="name-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error">
                    <span class="error-message" id="email-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="subject">Subject <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="subject" name="subject" required autocomplete="off" aria-describedby="subject-error">
                    <span class="error-message" id="subject-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
                    <span class="error-message" id="message-error" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
                <div id="form-status" class="form-status" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Adarsh R M. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
